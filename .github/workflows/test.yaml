name: test

on:
  pull_request:
    branches: [main, master, staging, dev, feat/**, fix/**]
  push:
    branches: [main, master, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || 'pr' }}

jobs:
  forge-test:
    name: Foundry project
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - name: Run Forge fmt check
        run: forge fmt --check

      - name: Run Forge tests
        run: forge test --no-match-contract '.*(Mainnet|Benchmark).*'

  forge-mainnet-test:
    name: Foundry ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The suites share one provider key. Running them one at a time keeps the combined
      # request rate inside the plan limit; concurrently they trip HTTP 429.
      max-parallel: 1
      matrix:
        suite:
          - name: mainnet forks
            id: mainnet-forks
            command: "forge test --isolate --match-contract '.*Mainnet.*' --no-match-contract '.*Benchmark.*'"
          - name: fork benchmarks
            id: fork-benchmarks
            command: "forge test --isolate --match-contract '.*Benchmark.*'"
    env:
      FOUNDRY_PROFILE: pr
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      # Must be at or after the Liquid Lane 3 deployment (blocks 25697401-25697403), otherwise
      # the mainnet suites assert against contracts that do not yet exist at the fork block.
      # Bump this whenever a deployment adds live state that new fork tests depend on.
      MAINNET_FORK_BLOCK: 25700000
      # Cap in-job test parallelism as a second brake on the provider request rate.
      # Note: --compute-units-per-second and --fork-retries cannot be used here. They are
      # gated behind --rpc-url, and --rpc-url is an alias for --fork-url, which would fork
      # every test rather than only the ones that call vm.createSelectFork.
      FORK_TEST_FLAGS: --threads 2
    steps:
      - uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      # Restore and save are split so the cache is written even when the suite fails.
      # actions/cache skips its post-run save on job failure, so while the suites were
      # failing every run started cold, re-fetched all state, and tripped the provider
      # rate limit - which failed the job, which skipped the save. A partial cache from
      # a failed run still removes most of the requests the next run would make.
      - name: Restore Foundry RPC cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.foundry/cache/rpc
          key: ${{ runner.os }}-foundry-rpc-mainnet-${{ env.MAINNET_FORK_BLOCK }}-${{ matrix.suite.id }}
          restore-keys: |
            ${{ runner.os }}-foundry-rpc-mainnet-${{ env.MAINNET_FORK_BLOCK }}-${{ matrix.suite.id }}
            ${{ runner.os }}-foundry-rpc-mainnet-${{ env.MAINNET_FORK_BLOCK }}-

      # A cold RPC cache makes the first attempt fetch every mainnet slot at once, which trips the
      # provider rate limit (HTTP 429). Foundry persists each response it does get to ~/.foundry/cache/rpc,
      # so every attempt starts warmer and needs fewer live requests - retrying in-job is what converges.
      # A fresh workflow run would not: Actions scopes caches per ref and main cannot read the ones a PR
      # branch wrote, so the first run after every merge starts cold. Only 429s are retried; any other
      # failure is a real one and exits immediately.
      - name: Run Forge mainnet tests
        run: |
          log="$RUNNER_TEMP/forge-attempt.log"
          for attempt in 1 2 3; do
            set +e
            ${{ matrix.suite.command }} $FORK_TEST_FLAGS 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q 'HTTP error 429' "$log"; then
              echo "::error::Attempt $attempt failed for reasons other than provider rate limiting."
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Attempt $attempt hit HTTP 429; backing off $((attempt * 60))s, then retrying with a warmer RPC cache."
              sleep "$((attempt * 60))"
            fi
          done
          echo "::error::Provider rate limit persisted across 3 attempts."
          exit 1

      - name: Save Foundry RPC cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.foundry/cache/rpc
          # Unique per run: cache/save errors on an existing key, and restore-keys above
          # matches the prefix so the newest entry is picked up regardless.
          key: ${{ runner.os }}-foundry-rpc-mainnet-${{ env.MAINNET_FORK_BLOCK }}-${{ matrix.suite.id }}-${{ github.run_id }}-${{ github.run_attempt }}
