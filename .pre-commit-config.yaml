# Prerequisites:
# - Foundry v1.8.1
# - Python 3.10+
# - Node.js (see .nvmrc)
# - pnpm 11.25.0

minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: "^(docs/autogen|snapshots/)"
      - id: trailing-whitespace
        exclude: "^(docs/autogen|snapshots/)"
      - id: end-of-file-fixer
        exclude: "^(docs/autogen|snapshots/)"
      - id: check-merge-conflict
      - id: check-json
        exclude: "^(docs/autogen|snapshots/)"
      - id: check-yaml

  - repo: local
    hooks:
      - id: sort-imports
        name: Sort imports
        description: Normalize and sort import statements in Solidity files
        language: system
        entry: uv run --no-project python script/utils/sort_imports.py
        files: "^(src|examples)/.*\\.sol$"
        pass_filenames: true
      - id: sort-errors
        name: Sort solidity errors
        description: Alphabetize error declarations in Solidity files
        language: system
        entry: uv run --no-project python script/utils/sort_errors.py
        files: "^(src|examples)/.*\\.sol$"
        pass_filenames: true
      - id: format
        name: Format solidity code
        description: Format solidity code with `forge fmt`
        language: system
        entry: forge fmt
        files: '\.sol$'
        exclude: "^lib/"
        pass_filenames: true
      - id: forge-snapshots
        name: Update forge snapshots
        language: system
        entry: bash -c 'set -euo pipefail; mkdir -p snapshots; forge build; forge build --sizes | tee snapshots/sizes.txt >/dev/null; FOUNDRY_PROFILE=snapshots forge test --isolate --no-match-contract ".*(Mainnet|Benchmark|Invariant).*" --gas-report --threads 1 --fuzz-seed 0 | sed -n "/^╭/,/^╰/p" | tee snapshots/gas.txt >/dev/null; FOUNDRY_PROFILE=snapshots forge test --isolate --match-contract ".*Invariant.*" --threads 1 --fuzz-seed 0'
        pass_filenames: false
  - repo: local
    hooks:
      - id: prettier
        name: Format non-solidity files with prettier
        language: system
        entry: pnpm dlx prettier@3.9.6 --write --list-different --ignore-unknown
        types: [text]
        exclude: "^(docs/autogen|snapshots/)"
